title = 'Hudocs'
theme = 'hudocs'
baseURL = 'https://hudocs.com/'

enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[menus]
  [[menus.main]]
    pageRef = "/docs"
    weight = 1

  [[menus.main]]
    pageRef = "/about"
    weight = 2

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[params]
  description = "A Hugo theme for documentation sites"